name: ginkgo_mirror
description: Ginkgo Android and Windows mirror, powered by a local Rust core.
publish_to: none
version: 0.1.0-alpha.4+5

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_rust_bridge: 2.12.0
  rust_lib_ginkgo_mirror:
    path: rust_builder
  path_provider: ^2.1.6
  # Retain the Kotlin plugin path and the project NDK 27 toolchain.
  path_provider_android: 2.2.22
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Ginkgo Sans
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Ginkgo Han
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
