name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild build \
            -project BUAA-Assistant.xcodeproj \
            -scheme BUAA-Assistant \
            -configuration Release \
            -destination 'platform=macOS' \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Import signing certificate (optional)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$RUNNER_TEMP/build.keychain" | grep "Ginkgo Local Signing"

      - name: Sign and package
        run: |
          APP="build/Build/Products/Release/Ginkgo.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          # 有稳定证书就用它（钥匙串授权一次长期有效），否则退回 ad-hoc 签名。
          if security find-identity -p codesigning 2>/dev/null | grep -q "Ginkgo Local Signing"; then
            IDENTITY="Ginkgo Local Signing"
          else
            IDENTITY="-"
          fi
          echo "signing identity: $IDENTITY"
          codesign --force --sign "$IDENTITY" --timestamp=none "$APP"
          codesign --verify --strict -vv "$APP"
          codesign -d -r- "$APP"
          ditto -c -k --keepParent "$APP" "Ginkgo-${GITHUB_REF_NAME}.zip"
          mkdir -p dist
          cp -R "$APP" dist/
          ln -s /Applications dist/Applications
          hdiutil create -volname "Ginkgo ${GITHUB_REF_NAME}" -srcfolder dist -ov -format UDZO "Ginkgo-${GITHUB_REF_NAME}.dmg"
          codesign --force --sign "$IDENTITY" --timestamp=none "Ginkgo-${GITHUB_REF_NAME}.dmg"
          hdiutil verify "Ginkgo-${GITHUB_REF_NAME}.dmg"
          shasum -a 256 Ginkgo-*.zip Ginkgo-*.dmg > checksums.txt
          cat checksums.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Ginkgo ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            Ginkgo-*.zip
            Ginkgo-*.dmg
            checksums.txt
