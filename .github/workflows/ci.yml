name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project BUAA-Assistant.xcodeproj \
            -scheme BUAA-Assistant \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Test
        run: |
          xcodebuild test \
            -project BUAA-Assistant.xcodeproj \
            -scheme BUAA-Assistant \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult -quiet

      - name: Whitespace check
        run: git diff --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
