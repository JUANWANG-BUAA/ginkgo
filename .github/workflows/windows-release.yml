name: Windows Alpha Release

on:
  push:
    tags: ['windows-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Check Windows PowerShell plugin paths
        shell: powershell
        run: scripts/check-mirror-windows-paths.ps1

      - name: Resolve locked dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Test Flutter
        working-directory: flutter
        run: flutter test --no-pub test

      - name: Test Windows integration
        working-directory: flutter
        run: flutter test --no-pub integration_test/windows_test.dart -d windows

      # Integration tests build a test entrypoint. Rebuild the product entrypoint
      # so the published ZIP starts at login instead of waiting for a test driver.
      - name: Build Windows release
        working-directory: flutter
        run: flutter build windows --release --no-pub --target lib/main.dart

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Verify the tag matches pubspec
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          $line = Get-Content -LiteralPath 'flutter\pubspec.yaml' |
            Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $pubspecVersion = ($line -replace '^version:\s*', '') -replace '\+.*$', ''
          if ($pubspecVersion -ne $version) {
            throw "pubspec version $pubspecVersion does not match tag version $version"
          }

      - name: Build and verify single-file installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          $bundle = (Resolve-Path 'flutter\build\windows\x64\runner\Release').Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'Inno Setup compiler was not installed'
          }
          & $iscc "/DAppVersion=$version" "/DBundleDir=$bundle" 'packaging\windows\Ginkgo.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = "dist\Ginkgo-$version-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Missing installer: $installer"
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'GinkgoInstalled'
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installDir))
          $process = Start-Process -FilePath (Resolve-Path $installer).Path -ArgumentList $installArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'ginkgo_mirror.exe') -PathType Leaf)) {
            throw 'Installer did not place ginkgo_mirror.exe'
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($process.ExitCode)" }

      - name: Package and verify Windows release
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'flutter/build/windows/x64/runner/Release'
          foreach ($relative in @('ginkgo_mirror.exe', 'ginkgo_flutter_bridge.dll', 'flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets/AssetManifest.bin', 'data/app.so')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $relative) -PathType Leaf)) {
              throw "Missing Windows release asset: $relative"
            }
          }

          $version = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          $zipName = "Ginkgo-$version-windows-x64.zip"
          $zipPath = Join-Path $PWD $zipName
          Remove-Item -LiteralPath $zipPath -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            if ($archive.Entries.Count -lt 10) {
              throw "Windows release ZIP has too few entries: $($archive.Entries.Count)"
            }
          } finally {
            $archive.Dispose()
          }

          $installer = Get-Item -LiteralPath "dist\Ginkgo-$version-windows-x64-setup.exe"
          $lines = @(
            "$((Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($installer.Name)"
            "$((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant())  $zipName"
          )
          $lines | Set-Content -LiteralPath checksums.txt -Encoding ascii
          Get-Content -LiteralPath checksums.txt

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^windows-v', ''
          $curated = "docs/releases/windows-$version.md"
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -DestinationPath 'release-notes.md'
          } else {
            @(
              "Ginkgo Windows $version 预发布版本。"
              "安装器未做代码签名；升级前请阅读该版本的发布说明与已知限制。"
            ) | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8
          }

      - name: Create Windows prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Ginkgo Windows ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/Ginkgo-*-windows-x64-setup.exe
            Ginkgo-*-windows-x64.zip
            checksums.txt
