name: Rust Flutter mirror

on:
  push:
    branches: [main]
    paths: ['rust/**', 'flutter/**', 'fixtures/**', 'scripts/*mirror*', '.github/workflows/mirror.yml']
  pull_request:
    paths: ['rust/**', 'flutter/**', 'fixtures/**', 'scripts/*mirror*', '.github/workflows/mirror.yml']
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: cargo install cargo-expand --version 1.0.127 --locked
      - run: flutter pub get
        working-directory: flutter
      - run: scripts/generate-mirror-bridge.sh
      - run: git diff --exit-code -- flutter/lib/src/rust rust/crates/ginkgo_flutter_bridge/src/frb_generated.rs
      - run: python3 scripts/check-mirror-windows-cmake.py
      - run: flutter analyze
        working-directory: flutter
      - run: flutter test test
        working-directory: flutter

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Do not depend on tools preinstalled by ubuntu-latest.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: flutter
      - uses: actions/upload-artifact@v4
        with:
          name: ginkgo-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check Windows PowerShell plugin paths
        shell: powershell
        run: scripts/check-mirror-windows-paths.ps1
      - run: flutter build windows --debug
        working-directory: flutter
      - run: flutter test test
        working-directory: flutter
      # Keep desktop acceptance independent of the known, unbounded classroom
      # interaction flow. This smoke also exercises Windows Credential Manager.
      - run: flutter test integration_test/windows_test.dart -d windows
        working-directory: flutter
      # Integration tests rebuild the runner with their own Dart entrypoint.
      # Restore the product main.dart before publishing a runnable artifact.
      - run: flutter build windows --debug --target lib/main.dart
        working-directory: flutter
      - name: Verify Windows application bundle
        shell: pwsh
        run: |
          $bundle = 'flutter/build/windows/x64/runner/Debug'
          foreach ($relative in @('ginkgo_mirror.exe', 'ginkgo_flutter_bridge.dll', 'flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets/AssetManifest.bin')) {
            if (-not (Test-Path -LiteralPath "$bundle/$relative" -PathType Leaf)) {
              throw "Missing Windows bundle asset: $relative"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ginkgo-windows-debug
          path: flutter/build/windows/x64/runner/Debug/
          if-no-files-found: error
