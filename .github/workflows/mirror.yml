name: Rust Flutter mirror

on:
  push:
    branches: [main]
    paths: ['rust/**', 'flutter/**', 'fixtures/**', 'scripts/**', 'docs/interfaces/**', '.github/workflows/mirror.yml']
  pull_request:
    paths: ['rust/**', 'flutter/**', 'fixtures/**', 'scripts/**', 'docs/interfaces/**', '.github/workflows/mirror.yml']
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: python3 scripts/check-mirror-architecture.py
      - run: python3 scripts/check-mirror-architecture-test.py
      - run: python3 scripts/generate-interface-index-test.py
      - run: python3 scripts/check-design-tokens.py
      - run: python3 scripts/generate-interface-index.py --check
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml -p ginkgo_core --no-default-features --locked
      - run: cargo test --manifest-path rust/Cargo.toml -p ginkgo_upstream --locked
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - run: git diff --exit-code -- rust/Cargo.lock
      - run: git diff --exit-code --check
      - name: Validate the update gate manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('docs/update-gate.json').read_text())
          assert data.get('schema') == 1, 'schema must be 1'
          assert isinstance(data.get('minBuild'), int), 'minBuild must be an integer'
          print('update-gate.json OK:', data)
          PY
          # The gate is served from the Pages branch (main:/docs). Warn while it
          # is missing there: a 404 makes the client fail open and skip the gate.
          git fetch --no-tags --depth=1 origin main
          if ! git cat-file -e origin/main:docs/update-gate.json 2>/dev/null; then
            echo "::warning::docs/update-gate.json is absent from origin/main; the served update gate 404s and every client fails open. Merge the manifest to main before the next release."
          fi

  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: cargo install cargo-expand --version 1.0.127 --locked
      - run: flutter pub get
        working-directory: flutter
      - name: Resolve standalone Cargokit analyzer dependencies
        run: dart pub get
        working-directory: flutter/rust_builder/cargokit/build_tool
      - run: scripts/generate-mirror-bridge.sh
      - run: git diff --exit-code -- flutter/lib/src/rust rust/crates/ginkgo_flutter_bridge/src/frb_generated.rs
      - run: git diff --exit-code -- flutter/pubspec.lock flutter/rust_builder/cargokit/build_tool/pubspec.lock
      - run: python3 scripts/check-mirror-windows-cmake.py
      - run: flutter analyze
        working-directory: flutter
      - run: flutter test test
        working-directory: flutter

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Do not depend on tools preinstalled by ubuntu-latest.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: flutter
      # A build must never rewrite the dependency lock it was verified against.
      - run: git diff --exit-code -- flutter/pubspec.lock
      - run: git diff --exit-code --check
      - uses: actions/upload-artifact@v4
        with:
          name: ginkgo-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check Windows PowerShell plugin paths
        shell: powershell
        run: scripts/check-mirror-windows-paths.ps1
      - run: flutter build windows --debug
        working-directory: flutter
      - run: flutter test test
        working-directory: flutter
      # Keep desktop acceptance independent of the known, unbounded classroom
      # interaction flow. This smoke also exercises Windows Credential Manager.
      - run: flutter test integration_test/windows_test.dart -d windows
        working-directory: flutter
      # Integration tests rebuild the runner with their own Dart entrypoint.
      # Restore the product main.dart before publishing a runnable artifact.
      - run: flutter build windows --debug --target lib/main.dart
        working-directory: flutter
      - name: Verify Windows application bundle
        shell: pwsh
        run: |
          $bundle = 'flutter/build/windows/x64/runner/Debug'
          foreach ($relative in @('ginkgo_mirror.exe', 'ginkgo_flutter_bridge.dll', 'flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets/AssetManifest.bin')) {
            if (-not (Test-Path -LiteralPath "$bundle/$relative" -PathType Leaf)) {
              throw "Missing Windows bundle asset: $relative"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ginkgo-windows-debug
          path: flutter/build/windows/x64/runner/Debug/
          if-no-files-found: error
