name: Ginkgo-iOS
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GinkgoiOS:
    type: application
    platform: iOS
    productName: Ginkgo
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../BUAA-Assistant
        name: Shared
        excludes:
          - "BUAAAssistantApp.swift"
          - "RootView.swift"
          - "MainView.swift"
          - "Assets.xcassets"
          - "Core/Keyboard/**"
          - "Core/LaunchAtLogin/**"
          - "Core/Notification/**"
          - "Features/Auth/LoginView.swift"
          - "Features/Settings/SettingsView.swift"
          # macOS 专用页面：iOS 在 Sources/Native/ 下有各自的原生实现。
          - "Features/Today/TodayView.swift"
          - "Features/Schedule/ScheduleView.swift"
          - "Features/Schedule/TimetableGrid.swift"
          - "Features/Schedule/ExamScheduleSection.swift"
          - "Features/Grade/GradeView.swift"
          - "Features/Homework/HomeworkView.swift"
          - "Features/Library/LibraryView.swift"
          - "Features/Classroom/ClassroomView.swift"
          - "Features/CheckIn/CheckInSummaryView.swift"
          - "Features/Tasks/TasksView.swift"
          - "Features/Campus/CampusNoticesSummaryView.swift"
          - "Features/BYKC/BykcView.swift"
          - "Features/Graduate/GraduateAcademicView.swift"
          - "Features/Venue/CgyyView.swift"
          - "Core/UI/PageComponents.swift"
          - "Core/UI/MacViewModifiers.swift"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ginkgo
        CFBundleName: Ginkgo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buaaassistant.app.ios
        PRODUCT_NAME: Ginkgo
        PRODUCT_MODULE_NAME: BUAA_Assistant
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
  GinkgoiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../BUAA-AssistantTests
    dependencies:
      - target: GinkgoiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buaaassistant.app.ios.tests
        PRODUCT_NAME: GinkgoiOSTests
        GENERATE_INFOPLIST_FILE: YES
  GinkgoiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GinkgoiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buaaassistant.app.ios.uitests
        PRODUCT_NAME: GinkgoiOSUITests
        TEST_TARGET_NAME: GinkgoiOS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ginkgo-iOS:
    build:
      targets:
        GinkgoiOS: all
        GinkgoiOSTests:
          - test
        GinkgoiOSUITests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - GinkgoiOSTests
        - GinkgoiOSUITests
