[package]
name = "ginkgo_upstream"
version = "0.1.0"
edition.workspace = true

[dependencies]
ginkgo_domain = { path = "../ginkgo_domain" }
serde.workspace = true
serde_json.workspace = true
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
url = "2"
regex = "1"
httpdate = "1"
aes = "0.8"
cfb-mode = "0.8"
cipher = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"], optional = true }
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
md-5 = "0.10"

[features]
experimental-homework-upload = []
test-support = []
default = []
network = ["dep:reqwest", "tokio/rt", "tokio/rt-multi-thread", "tokio/time"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }

[[example]]
name = "homework_live_read"
required-features = ["network"]

[[example]]
name = "learning_probe"
required-features = ["network"]
