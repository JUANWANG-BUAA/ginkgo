[package]
name = "ginkgo_flutter_bridge"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ginkgo_runtime = { path = "../ginkgo_runtime" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "rt"] }
flutter_rust_bridge = "=2.12.0"
ginkgo_core = { path = "../ginkgo_core" }
# The pure rule commands need the school wall clock, not the device timezone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[features]
experimental-homework-upload = ["ginkgo_runtime/experimental-homework-upload"]
