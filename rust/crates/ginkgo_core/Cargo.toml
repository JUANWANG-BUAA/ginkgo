[package]
name = "ginkgo_core"
version = "0.1.0"
edition.workspace = true

[dependencies]
ginkgo_domain = { path = "../ginkgo_domain" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rand = "0.8"
sha1 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
